name: Patch Apps

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday at midnight

jobs:
  Patch-apps:
    environment: SECRET_ENV
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            YTMusic-patch.json
            GooglePhotos-patch.json
            ytmversion.py
            photosversion.py
            check_patch_updates.py
          sparse-checkout-cone-mode: false
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Check for Patch Updates
        id: check_updates
        run: |
          pip install requests
          python3 check_patch_updates.py
        continue-on-error: true
      
      - name: Set up Java
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          pip install requests
          sudo apt-get update
          sudo apt-get install -y jq curl wget
      
      - name: Download Apkeep
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          wget https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu -O apkeep
          chmod +x apkeep
          sudo mv apkeep /usr/local/bin/

      - name: Download APKEditor
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          APK_EDITOR_URL=$(curl -s https://api.github.com/repos/REAndroid/APKEditor/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -1)
          if [ -z "$APK_EDITOR_URL" ]; then
            echo "ERROR: Could not find APKEditor jar"
            exit 1
          fi
          wget "$APK_EDITOR_URL" -O apk-editor.jar
          chmod +x apk-editor.jar

      - name: Download Morphe Patches (YouTube Music)
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          PATCHES_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url')
          MORPHE_PATCHES_VERSION=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | jq -r '.tag_name' | sed 's/v//')
          wget "$PATCHES_URL" -O patches-morphe.mpp
          echo "MORPHE_PATCHES_VERSION=$MORPHE_PATCHES_VERSION" >> $GITHUB_ENV

      - name: Download Google Photos Patches (Fork)
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          PHOTOS_PATCHES_URL=$(curl -s https://api.github.com/repos/rushiranpise/morphe-patches/releases/latest | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url')
          PHOTOS_PATCHES_VERSION=$(curl -s https://api.github.com/repos/rushiranpise/morphe-patches/releases/latest | jq -r '.tag_name' | sed 's/v//')
          wget "$PHOTOS_PATCHES_URL" -O patches-photos.mpp
          echo "PHOTOS_PATCHES_VERSION=$PHOTOS_PATCHES_VERSION" >> $GITHUB_ENV

      - name: Download Morphe CLI
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url')
          CLI_VERSION=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.tag_name' | sed 's/v//')
          wget "$CLI_URL" -O morphe-cli.jar
          echo "CLI_VERSION=$CLI_VERSION" >> $GITHUB_ENV
      
      - name: Download Keystore
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          curl -L -H "Authorization: token ${{ secrets.KEYSTORE_ACCESS_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o SenyxPatch.keystore \
               https://api.github.com/repos/SenyxLois/Keystore/contents/SenyxPatch.keystore
          
          if [ ! -f SenyxPatch.keystore ]; then
            echo "ERROR: Failed to download keystore"
            exit 1
          fi
          
          # Verify keystore file size (should not be empty or too small)
          KEYSTORE_SIZE=$(stat -c%s SenyxPatch.keystore)
          if [ "$KEYSTORE_SIZE" -lt 100 ]; then
            echo "ERROR: Keystore file is too small ($KEYSTORE_SIZE bytes). Possible download issue."
            exit 1
          fi
      
      - name: Find compatible YT Music version
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        id: find_version
        run: |
          python3 ytmversion.py

      - name: Find compatible Google Photos version
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        id: find_photos_version
        run: |
          python3 photosversion.py
      
      - name: Download YouTube Music APK
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "${{ env.YT_MUSIC_USE_LATEST }}" = "true" ]; then
            echo "Downloading latest YouTube Music APK"
            apkeep -a com.google.android.apps.youtube.music .
          else
            echo "Downloading YouTube Music version ${{ env.YT_MUSIC_VERSION }}"
            apkeep -a com.google.android.apps.youtube.music@${{ env.YT_MUSIC_VERSION }} .
          fi
          
          # Find the downloaded file
          APK_FILE=$(ls com.google.android.apps.youtube.music*.apk 2>/dev/null || ls com.google.android.apps.youtube.music*.apks 2>/dev/null || ls com.google.android.apps.youtube.music*.apkm 2>/dev/null || echo "")
          
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file not found"
            exit 1
          fi
          
          # Check if it's .apks or .apkm (not supported yet)
          if [[ "$APK_FILE" == *.apks ]] || [[ "$APK_FILE" == *.apkm ]]; then
            echo "ERROR: .apks and .apkm formats are under construction"
            exit 1
          fi
          
          # Rename to standard format if needed
          if [ "$APK_FILE" != "youtube_music.apk" ]; then
            mv "$APK_FILE" youtube_music.apk
          fi
          
          echo "APK_FILE=youtube_music.apk" >> $GITHUB_ENV
      
      - name: Download Google Photos APK
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "${{ env.GOOGLE_PHOTOS_USE_LATEST }}" = "true" ]; then
            echo "Downloading latest Google Photos APK"
            apkeep -a com.google.android.apps.photos .
          else
            echo "Downloading Google Photos version ${{ env.GOOGLE_PHOTOS_VERSION }}"
            apkeep -a com.google.android.apps.photos@${{ env.GOOGLE_PHOTOS_VERSION }} .
          fi
          
          echo "Downloaded files:"
          ls -la
          
          # Find the downloaded file (could be APK, XAPK, APKS, APKM, etc.)
          APK_FILE=$(ls com.google.android.apps.photos*.apk 2>/dev/null | grep -v "config\." || ls com.google.android.apps.photos* 2>/dev/null | grep -E "\.(xapk|apks|apkm)$" || echo "")
          
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file not found"
            exit 1
          fi
          
          echo "Found file: $APK_FILE"
          
          # Check if it's a plain APK or needs merging
          if [[ "$APK_FILE" == *.apk ]] && [[ ! "$APK_FILE" =~ config ]]; then
            # Plain APK file, use as-is
            if [ "$APK_FILE" != "google_photos.apk" ]; then
              mv "$APK_FILE" google_photos.apk
            fi
          else
            # XAPK, APKS, APKM, or other format - use APKEditor to merge
            echo "Using APKEditor to merge $APK_FILE"
            java -jar apk-editor.jar m -i "$APK_FILE" -o google_photos.apk
            
            if [ ! -f "google_photos.apk" ]; then
              echo "ERROR: APKEditor merge failed"
              exit 1
            fi
          fi
          
          # Verify the APK file exists
          if [ -f "google_photos.apk" ]; then
            echo "GOOGLE_PHOTOS_APK=google_photos.apk" >> $GITHUB_ENV
            echo "Using Google Photos APK: google_photos.apk"
          else
            echo "ERROR: No suitable APK file found"
            exit 1
          fi
      
      - name: Extract Google Photos Version
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          # Install aapt if not already available
          if ! command -v aapt &> /dev/null; then
            echo "Installing aapt..."
            sudo apt-get install -y aapt
          fi
          
          # Extract version from APK
          PHOTOS_VERSION=$(aapt dump badging google_photos.apk | grep "versionName=" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          
          if [ -z "$PHOTOS_VERSION" ]; then
            echo "ERROR: Could not extract version from Google Photos APK"
            exit 1
          fi
          
          echo "Extracted Google Photos version: $PHOTOS_VERSION"
          echo "GOOGLE_PHOTOS_VERSION=$PHOTOS_VERSION" >> $GITHUB_ENV
      
      - name: Patch YouTube Music APK
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          OUTPUT_APK="ytmusic_${{ env.YT_MUSIC_VERSION }}_morphe${{ env.MORPHE_PATCHES_VERSION }}.apk"
          
          # Build patch arguments properly
          PATCH_ARGS=""
          while IFS= read -r patch; do
            PATCH_ARGS="$PATCH_ARGS -e \"$patch\""
          done < enabled_patches.txt
          
          eval java -jar morphe-cli.jar patch \
            -p patches-morphe.mpp \
            youtube_music.apk \
            --exclusive \
            $PATCH_ARGS \
            --keystore SenyxPatch.keystore \
            --keystore-entry-alias \"${{ secrets.KEYSTORE_ALIAS }}\" \
            --keystore-entry-password \"${{ secrets.KEYSTORE_PASS }}\" \
            --keystore-password \"${{ secrets.KEYSTORE_PASS2 }}\" \
            -o \"$OUTPUT_APK\"
          
          echo "OUTPUT_APK=$OUTPUT_APK" >> $GITHUB_ENV

      - name: Patch Google Photos APK
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          OUTPUT_PHOTOS_APK="photos_${{ env.GOOGLE_PHOTOS_VERSION }}_morphe${{ env.PHOTOS_PATCHES_VERSION }}.apk"
          
          # Build patch arguments properly
          PATCH_ARGS=""
          while IFS= read -r patch; do
            PATCH_ARGS="$PATCH_ARGS -e \"$patch\""
          done < enabled_patches_photos.txt
          
          eval java -jar morphe-cli.jar patch \
            -p patches-photos.mpp \
            google_photos.apk \
            --exclusive \
            $PATCH_ARGS \
            --keystore SenyxPatch.keystore \
            --keystore-entry-alias \"${{ secrets.KEYSTORE_ALIAS }}\" \
            --keystore-entry-password \"${{ secrets.KEYSTORE_PASS }}\" \
            --keystore-password \"${{ secrets.KEYSTORE_PASS2 }}\" \
            -o \"$OUTPUT_PHOTOS_APK\"
          
          echo "OUTPUT_PHOTOS_APK=$OUTPUT_PHOTOS_APK" >> $GITHUB_ENV

      - name: Get Tool Versions
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          echo "BUILD_DATE=$(date +'%Y-%m-%dT%H:%M:%S')" >> $GITHUB_ENV
          echo "TAG_NAME=morphe-${{ env.MORPHE_PATCHES_VERSION }}_photos-${{ env.PHOTOS_PATCHES_VERSION }}" >> $GITHUB_ENV
          # Get Apkeep version
          APKEEP_VERSION=$(apkeep --version 2>&1 | grep -oP '\d+\.\d+\.\d+' || echo "unknown")
          echo "APKEEP_VERSION=$APKEEP_VERSION" >> $GITHUB_ENV
          
          # APKEditor is not used in this workflow, set as N/A
          echo "APKEDITOR_VERSION=N/A" >> $GITHUB_ENV

      - name: Create Release
        if: ${{ env.UPDATES_AVAILABLE == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Senyx's Patched APK's - ${{ env.BUILD_DATE }}
          body: |
            <small>If you want to know what patch is enabled read enabled_patches.txt!</small>
            <small>To use these google apps you need to have [MicroG](https://github.com/WSTxda/MicroG-RE/releases) installed!</small>

            ## Patched APK's

            ### <img width="25" height="25" alt="image" src="https://raw.githubusercontent.com/SenyxLois/patched-apks/refs/heads/main/icon/ytmicon.png" /> YouTube Music [ Morphe ]

            - **YT Music Version:** ${{ env.YT_MUSIC_VERSION }}
            - **Morphe Patch Version:** ${{ env.MORPHE_PATCHES_VERSION }}

            ### <img width="25" height="25" alt="image" src="https://raw.githubusercontent.com/SenyxLois/patched-apks/refs/heads/main/icon/gphotoicon.png" /> Google Photos [ Morphe ]
            - **Google Photos Version:** ${{ env.GOOGLE_PHOTOS_VERSION }}
            - **Google Photos Patch version:** ${{ env.PHOTOS_PATCHES_VERSION }}

            ## 🛠️ Tool Used 
            - **Morphe CLI:** ${{ env.CLI_VERSION }}
            - **Apkeep :** ${{ env.APKEEP_VERSION }}
            - **Build Date:** ${{ env.BUILD_DATE }}

          files: |
            ${{ env.OUTPUT_APK }}
            ${{ env.OUTPUT_PHOTOS_APK }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
